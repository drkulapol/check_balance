<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจสอบงบทดลองโรงพยาบาล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger workbench — sticky top bar with tabs, summary first, then per-account audit rows grouped by หมวด */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#e8eeec; --line:#d3dcd9;
  --fg:#16211f; --muted:#5b6b67; --accent:#0d5e66; --accent-soft:#d6ebec;
  --crit:#b42318; --crit-bg:#fde8e6; --warn:#a35a00; --warn-bg:#fdf0d9;
  --ok:#1d7a46; --ok-bg:#e1f3e8; --na:#6b7672; --na-bg:#eceff0;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#161e1d; --surface-2:#1d2726; --line:#2c3836;
  --fg:#e3ebe9; --muted:#93a39f; --accent:#5fc0c8; --accent-soft:#163a3d;
  --crit:#ff8a7e; --crit-bg:#3a1714; --warn:#f2b45a; --warn-bg:#3a2a10;
  --ok:#6fd39a; --ok-bg:#12301f; --na:#97a3a0; --na-bg:#232c2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#161e1d; --surface-2:#1d2726; --line:#2c3836;
  --fg:#e3ebe9; --muted:#93a39f; --accent:#5fc0c8; --accent-soft:#163a3d;
  --crit:#ff8a7e; --crit-bg:#3a1714; --warn:#f2b45a; --warn-bg:#3a2a10;
  --ok:#6fd39a; --ok-bg:#12301f; --na:#97a3a0; --na-bg:#232c2b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-size:1.35rem;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:4px}
.tab{appearance:none;border:0;background:none;font:inherit;font-family:var(--f-display);font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn:hover{border-color:var(--accent)}
.hint{color:var(--muted);font-size:.85rem}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:.85rem;flex:1 1 260px}
.drop.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
h2{font-family:var(--f-display);font-size:1.15rem;margin:28px 0 10px;font-weight:600}
h3{font-family:var(--f-display);font-size:1rem;margin:0;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .lab{font-size:.8rem;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi.crit .val{color:var(--crit)} .kpi.warn .val{color:var(--warn)} .kpi.ok .val{color:var(--ok)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.78rem;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.82rem}
.code{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-crit{color:var(--crit);background:var(--crit-bg)} .s-warn{color:var(--warn);background:var(--warn-bg)}
.s-ok{color:var(--ok);background:var(--ok-bg)} .s-na{color:var(--na);background:var(--na-bg)}
.cell{display:inline-block;min-width:44px;text-align:center;font-family:var(--f-mono);font-size:.8rem;font-weight:500;padding:3px 8px;border-radius:5px;cursor:pointer;border:0}
.hosp-link{appearance:none;border:0;background:none;font:inherit;color:var(--accent);font-weight:600;cursor:pointer;text-align:left;padding:0}
.hosp-link:hover{text-decoration:underline}
.matrix th.cat{white-space:normal;min-width:84px;text-align:center;line-height:1.3}
.matrix td.c{text-align:center}
.bars{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.bar-row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 70px;gap:10px;align-items:center;font-size:.86rem}
.bar-track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden;display:flex}
.bar-track span{display:block;height:100%}
.bar-row .n{font-family:var(--f-mono);font-size:.8rem;text-align:right;color:var(--muted)}
.issues{display:grid;gap:8px}
.issue{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--crit);border-radius:6px;padding:10px 12px}
.issue.w{border-left-color:var(--warn)}
.issue .meta{font-size:.8rem;color:var(--muted)}
.issue .msg{grid-column:1/-1;font-size:.9rem}
.issue .adv{grid-column:1/-1;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.issue .adv b{color:var(--accent);font-weight:600;margin-right:6px}
.issue .hosp-link{font-weight:600}
.hsel{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=search]{font:inherit;font-size:.92rem;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:100%}
.hhead{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-top:18px}
.hhead .name{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.hhead .sub{color:var(--muted)}
.dso{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.dso-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.dso-card .t{font-size:.84rem;font-weight:600;line-height:1.35}
.dso-card .code{display:block}
.dso-card .d{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.dso-card .d small{font-size:.85rem;font-weight:500;color:var(--muted);margin-left:4px}
.gauge{position:relative;height:10px;background:var(--surface-2);border-radius:3px}
.gauge .fill{position:absolute;inset:0 auto 0 0;border-radius:3px}
.gauge .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.gauge-lab{position:relative;height:1.1em;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.dso-card .foot{font-size:.78rem;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.group{margin-top:16px}
.group-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.find{font-size:.86rem}
.find div+div{margin-top:2px}
.rulec{font-size:.76rem;color:var(--muted);margin-top:2px}
details.all{margin-top:28px}
details.all summary{cursor:pointer;font-family:var(--f-display);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.rm{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline}
.note{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:.88rem;z-index:20}
@media (max-width:560px){.bar-row{grid-template-columns:1fr 60px}.bar-row .bar-track{grid-column:1/-1;grid-row:2}.hhead .name{font-size:1.25rem}}
@media (prefers-reduced-motion:no-preference){.bar-track span,.gauge .fill{transition:width .4s ease}}
</style>
<style>html,body{margin:0}body{font-size:15px}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>ตรวจสอบงบทดลองโรงพยาบาล</h1>
      <p id="periodLine">ตรวจความครบถ้วนและความถูกต้องของการบันทึกบัญชีเบื้องต้น</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-exec" aria-selected="true" aria-controls="view-exec">สรุปผู้บริหาร</button>
      <button class="tab" role="tab" id="tab-hosp" aria-selected="false" aria-controls="view-hosp">รายโรงพยาบาล</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <button class="btn primary" id="addBtn">เพิ่มไฟล์งบทดลอง (.xlsx)</button>
    <input type="file" id="fileIn" accept=".xlsx,.xls" multiple hidden>
    <div class="drop" id="drop">ลากไฟล์ financial_report_*.xlsx มาวางที่นี่ได้หลายไฟล์พร้อมกัน ระบบอ่านไฟล์ในเบราว์เซอร์นี้เท่านั้น ไม่ส่งข้อมูลออกไปที่ใด</div>
  </div>

  <section id="view-exec" role="tabpanel" aria-labelledby="tab-exec"></section>
  <section id="view-hosp" role="tabpanel" aria-labelledby="tab-hosp" hidden></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

const TH_MONTHS=["ตุลาคม","พฤศจิกายน","ธันวาคม","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน"];
const fmt=n=>n==null||isNaN(n)?"–":Number(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>Number(n).toLocaleString("th-TH",{maximumFractionDigits:0});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const z=v=>Math.abs(v||0)<0.005;
const LBL={crit:"ผิดปกติ",warn:"ควรตรวจสอบ",ok:"ผ่าน",na:"ไม่พบบัญชี"};
const RANK={crit:3,warn:2,ok:1,na:0};
const pill=s=>`<span class="pill s-${s}">${LBL[s]}</span>`;
const worst=arr=>arr.reduce((a,b)=>RANK[b]>RANK[a]?b:a,"na");

function parseSheet(aoa){
  let month="",hosp="",hi=-1;
  aoa.forEach((r,i)=>{
    const a=String(r[0]??"").trim();
    if(!month&&a.startsWith("เดือน"))month=a;
    if(!hosp&&/^\d{5}\s*-/.test(a))hosp=a;
    if(hi<0&&a==="รหัสบัญชี")hi=i;
  });
  const rows=[];
  aoa.slice(hi+1).forEach(r=>{
    const c=String(r[0]??"").trim();
    if(/^\d{10}\.\d{3}$/.test(c))rows.push([c,String(r[1]??"").trim(),+r[2]||0,+r[3]||0,+r[4]||0,+r[5]||0]);
  });
  if(!rows.length)throw new Error("ไม่พบแถวรหัสบัญชีในไฟล์");
  return {month,hosp,rows};
}

function buildHospital(raw){
  const m=raw.hosp.match(/^(\d{5})\s*-\s*(.+?)(?:\s+เขตบริการ\s*(\d+))?(?:\s+จังหวัด\s*(.+))?$/)||[];
  const hcode=m[1]||"?", name=(m[2]||raw.hosp).trim(), region=m[3]||"", prov=(m[4]||"").trim();
  const mm=raw.month.match(/เดือน\s*(\S+)\s*ปีงบประมาณ\s*(\d{4})/)||[];
  const monthName=mm[1]||"", fy=+mm[2]||0;
  const mIdx=Math.max(1,TH_MONTHS.indexOf(monthName)+1||12);
  const ceStart=fy-543-1; // FY starts 1 Oct of previous CE year
  const start=new Date(Date.UTC(ceStart,9,1));
  const end=new Date(Date.UTC(ceStart,9+mIdx,0)); // last day of month mIdx
  const daysYTD=Math.round((end-start)/864e5)+1;
  const daysMonth=end.getUTCDate();
  const acc={};raw.rows.forEach(r=>acc[r[0]]={code:r[0],name:r[1],bf:r[2],dr:r[3],cr:r[4],cf:r[5]});
  const h={key:hcode+"|"+raw.month,hcode,name,region,prov,monthName,fy,mIdx,daysYTD,daysMonth,period:raw.month,acc,rows:raw.rows};
  h.results=runChecks(h);
  return h;
}

function runChecks(h){
  const out=[]; const A=h.acc;
  const add=(cat,code,rule,fn,fallbackName)=>{
    const a=A[code];
    if(!a){out.push({cat,code,name:fallbackName||code,rule,status:"na",msgs:["ไม่พบบัญชีนี้ในงบทดลอง"],a:null});return;}
    const msgs=[];let st="ok";
    const flag=(s,m)=>{msgs.push({s,m});if(RANK[s]>RANK[st])st=s;};
    fn(a,flag);
    out.push({cat,code,name:a.name,rule,status:st,msgs:msgs.length?msgs.map(x=>x.m):["เป็นไปตามเงื่อนไข"],a});

// ใช้รหัสบัญชีเป็นหลัก ถ้าไม่พบให้ค้นจากชื่อบัญชี
function resolve(A,code,name){
  if(A[code])return code;
  const norm=s=>s.replace(/\s+/g,"");
  const hit=Object.values(A).find(a=>norm(a.name)===norm(name));
  return hit?hit.code:code;
}

function adviceFor(r){
  const m=r.msgs.join(" ");
  switch(r.cat){
    case "clear": return "ตรวจสอบการตั้งลูกหนี้และตัดลูกหนี้ UC ในเดือนให้เท่ากัน และล้างยอดคงเหลือให้เป็น 0";
    case "dso": return r.status==="crit"?"ติดตามการส่งเบิกและเรียกเก็บ ตรวจว่าเงินที่ได้รับโอนแล้วได้บันทึกตัดลูกหนี้ครบหรือไม่":"ตรวจสอบการบันทึกรายได้ค่ารักษาคู่กับการตั้งลูกหนี้";
    case "armove": return /เดบิต/.test(m)?"ตรวจว่าได้ตั้งลูกหนี้จากข้อมูลบริการของเดือนแล้วหรือไม่":"ตรวจว่าได้บันทึกตัดลูกหนี้จากเงินที่ได้รับโอนในเดือนแล้วหรือไม่";
    case "inv": return "กระทบยอดกับรายงานคลัง (รับเข้า / จ่ายออก / คงเหลือ) ของเดือน";
    case "ap": return r.code==="2101020199.202"?"บันทึกตั้งเจ้าหนี้ค่ารักษาตามจ่าย OP นอก CUP ของเดือน":"ตรวจสอบการตั้งเจ้าหนี้จากใบส่งของและการบันทึกจ่ายชำระหนี้";
    case "accr": return "ตั้งค้างจ่ายสำหรับค่าใช้จ่ายของเดือนที่ยังไม่ได้จ่าย";
    case "drg": return "ตรวจสอบการบันทึกส่วนต่าง DRG กรมบัญชีกลางให้ครบและลงถูกด้าน";
    case "comp": return "ตรวจสอบว่าได้บันทึกค่าตอบแทนของเดือนครบทุกรายการหรือไม่";
    case "used": return /เกิน 200%/.test(m)?"ตรวจว่ามีการบันทึกย้อนหลังหลายเดือนรวมกัน หรือบันทึกซ้ำ":"ตรวจสอบการตัดยอดใช้ไปตามรายงานเบิกจ่ายจากคลังของเดือน";
    case "recur": return "บันทึกค่าใช้จ่ายประจำเดือน (เงินเดือน ค่าจ้าง ค่าไฟฟ้า) ให้ครบ";
  }
  return "";
}

const STORE="tb-audit-hospitals-v1";
let hospitals=[]; let curKey=null; let filter="all";
function save(){try{localStorage.setItem(STORE,JSON.stringify(hospitals.filter(h=>!h.seed).map(h=>({month:h.period,hosp:h.raw,rows:h.rows}))));}catch(e){}}
function addRaw(raw,isSeed){
  const h=buildHospital(raw);h.raw=raw.hosp;h.seed=!!isSeed;
  const i=hospitals.findIndex(x=>x.key===h.key);
  if(i>=0)hospitals[i]=h;else hospitals.push(h);
  hospitals.sort((a,b)=>a.hcode.localeCompare(b.hcode)||b.mIdx-a.mIdx);
  return h;
}
function load(){
  if(SEED)addRaw(SEED,true);
  try{const s=JSON.parse(localStorage.getItem(STORE)||"[]");s.forEach(r=>{try{addRaw(r,false)}catch(e){}});}catch(e){}
  curKey=hospitals[0]?.key||null;
}

function summarize(h){
  const c={crit:0,warn:0,ok:0,na:0};h.results.forEach(r=>c[r.status]++);
  const byCat={};CATS.forEach(k=>{const rs=h.results.filter(r=>r.cat===k.id);byCat[k.id]={status:worst(rs.map(r=>r.status)),crit:rs.filter(r=>r.status==="crit").length,warn:rs.filter(r=>r.status==="warn").length,total:rs.length};});
  return {c,byCat};
}

      <td>${s.h.seed?"":`<button class="rm" data-rm="${esc(s.h.key)}">นำออก</button>`}</td></tr>`).join("")
  }</tbody></table></div>
  <p class="note">ตัวเลขในช่องคือจำนวนบัญชีที่พบประเด็นในหมวดนั้น สีแสดงระดับที่รุนแรงที่สุดในหมวด กดที่ช่องเพื่อดูรายละเอียดของโรงพยาบาล</p>`;

  const catAgg=CATS.map(k=>({k,crit:S.reduce((n,s)=>n+s.byCat[k.id].crit,0),warn:S.reduce((n,s)=>n+s.byCat[k.id].warn,0)}));
  const maxC=Math.max(1,...catAgg.map(c=>c.crit+c.warn));
  const bars=`<div class="bars">${catAgg.map(c=>`<div class="bar-row"><div>${c.k.name}</div><div class="bar-track" role="img" aria-label="${c.k.name}: ผิดปกติ ${c.crit} ควรตรวจสอบ ${c.warn}"><span style="width:${c.crit/maxC*100}%;background:var(--crit)"></span><span style="width:${c.warn/maxC*100}%;background:var(--warn)"></span></div><div class="n">${c.crit} / ${c.warn}</div></div>`).join("")}
    <div class="hint">จำนวนรายการ ผิดปกติ / ควรตรวจสอบ รวมทุกโรงพยาบาล</div></div>`;

  const listOf=st=>{const L=[];S.forEach(s=>s.h.results.filter(r=>r.status===st).forEach(r=>L.push({h:s.h,r})));return L;};
  const issueCard=({h,r})=>`<div class="issue${r.status==="warn"?" w":""}">${pill(r.status)}<div class="meta"><button class="hosp-link" data-go="${esc(h.key)}" data-cat="${r.cat}">${esc(h.name)}</button> · ${CATS.find(c=>c.id===r.cat).name} · <span class="code">${r.code}</span> ${esc(r.name)}</div><div class="msg">${r.msgs.map(esc).join("<br>")}</div><div class="adv"><b>คำแนะนำ</b> ${esc(adviceFor(r))}</div></div>`;
  const crits=listOf("crit"), warns=listOf("warn");
  const issues=crits.length?`<div class="issues">${crits.map(issueCard).join("")}</div>`:`<div class="empty">ไม่พบรายการระดับผิดปกติ</div>`;
  const warnList=warns.length?`<div class="issues">${warns.map(issueCard).join("")}</div>`:`<div class="empty">ไม่พบรายการที่ควรตรวจสอบ</div>`;

  el.innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="lab">โรงพยาบาลที่ตรวจ</div><div class="val">${hospitals.length}</div></div>
    <div class="kpi crit"><div class="lab">โรงพยาบาลที่พบรายการผิดปกติ</div><div class="val">${hCrit}</div></div>
    <div class="kpi crit"><div class="lab">รายการผิดปกติ</div><div class="val">${tot.crit}</div></div>
    <div class="kpi warn"><div class="lab">รายการควรตรวจสอบ</div><div class="val">${tot.warn}</div></div>
    <div class="kpi ${dsoOver?"crit":"ok"}"><div class="lab">ลูกหนี้เก็บนานเกิน ${DSO_LIMIT} วัน</div><div class="val">${dsoOver}</div></div>
  </div>
  <h2>สถานะรายหมวดของแต่ละโรงพยาบาล</h2>${matrix}
  <h2>หมวดที่พบความคลาดเคลื่อน</h2>${bars}
  <h2>รายการผิดปกติที่ต้องแก้ไข (${crits.length})</h2>${issues}
  <h2>รายการที่ควรตรวจสอบ (${warns.length})</h2>
  <p class="note" style="margin-top:-4px;margin-bottom:10px">อาจไม่ใช่ข้อผิดพลาดเสมอไป แนะนำให้งานบัญชีตรวจทานกับเอกสารประกอบ</p>${warnList}`;
}

/* ---------- render: hospital ---------- */
function renderHosp(focusCat){
  const el=document.getElementById("view-hosp");
  if(!hospitals.length){el.innerHTML=`<div class="empty">ยังไม่มีข้อมูล</div>`;return;}
  const h=hospitals.find(x=>x.key===curKey)||hospitals[0];curKey=h.key;
  const s=summarize(h);
  const opts=hospitals.map(x=>`<option value="${esc(x.key)}"${x.key===h.key?" selected":""}>${x.hcode} ${esc(x.name)} · ${esc(x.monthName)} ${x.fy}</option>`).join("");

  const dso=h.dso.map(d=>{
    const st=!d.found?"na":d.days==null?(z(d.arBal)?"ok":"warn"):d.days>DSO_LIMIT?"crit":"ok";
    const scaleMax=Math.max(120,Math.ceil((d.days||0)/30)*30);
    const w=d.days==null?0:Math.min(100,d.days/scaleMax*100);
    const col=st==="crit"?"var(--crit)":st==="warn"?"var(--warn)":"var(--ok)";
    const tip=d.parts.map(p=>`${p.code} ${p.name}: สะสม ${fmt(p.ytd)} / เดือนนี้ ${fmt(p.mon)}${p.found?"":" (ไม่พบบัญชี)"}`).join("\n");
    return `<div class="dso-card" title="${esc(tip)}">
      <div class="t">${esc(d.short)}<span class="code">${d.ar}</span></div>
      <div class="d" style="color:${col}">${d.days==null?"–":d.days.toFixed(1)}<small>วัน</small></div>
      <div class="gauge"><div class="fill" style="width:${w}%;background:${col}"></div><div class="mark" style="left:${DSO_LIMIT/scaleMax*100}%"></div></div>
      <div class="gauge-lab"><span style="position:absolute;left:0">0</span><span style="position:absolute;left:${DSO_LIMIT/scaleMax*100}%;transform:translateX(-50%)">${DSO_LIMIT}</span><span style="position:absolute;right:0">${scaleMax} วัน</span></div>
      <div class="foot">ลูกหนี้คงเหลือ ${fmt(d.arBal)}<br>รายได้สะสม ${fmt(d.revYTD)} · เดือนนี้ ${fmt(d.revMon)}<br>คิดจากรายได้เดือนนี้: ${d.daysMon==null?"–":d.daysMon.toFixed(1)+" วัน"}</div>
    </div>`;}).join("");

  const fl=["all","crit","warn","ok"].map(k=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${k==="all"?"ทั้งหมด "+h.results.length:LBL[k]+" "+s.c[k]}</button>`).join("");
  const groups=CATS.map(k=>{
    const rs=h.results.filter(r=>r.cat===k.id&&(filter==="all"||r.status===filter));
    if(!rs.length)return "";
    return `<div class="group" id="g-${k.id}"><div class="group-h"><h3>${k.name}</h3>${pill(s.byCat[k.id].status)}</div>
    <div class="scroll"><table><thead><tr><th>สถานะ</th><th>บัญชี</th><th class="num">ยอดยกมา</th><th class="num">เดบิต</th><th class="num">เครดิต</th><th class="num">ยอดยกไป</th><th>ข้อสังเกต</th></tr></thead><tbody>${
      rs.map(r=>`<tr><td>${pill(r.status)}</td><td style="min-width:220px"><div>${esc(r.name)}</div><div class="code">${r.code}</div></td>
        <td class="num">${r.a?fmt(r.a.bf):"–"}</td><td class="num">${r.a?fmt(r.a.dr):"–"}</td><td class="num">${r.a?fmt(r.a.cr):"–"}</td><td class="num">${r.a?fmt(r.a.cf):"–"}</td>
        <td class="find" style="min-width:240px">${r.msgs.map(m=>`<div>${esc(m)}</div>`).join("")}<div class="rulec">เกณฑ์: ${esc(r.rule)}</div></td></tr>`).join("")
    }</tbody></table></div></div>`;}).join("");

  el.innerHTML=`
  <div class="hsel"><label for="hospSel" class="hint">เลือกโรงพยาบาล</label><select id="hospSel">${opts}</select></div>
  <div class="hhead"><span class="name">${esc(h.name)}</span><span class="sub">รหัส ${h.hcode}${h.prov?" · จ."+esc(h.prov):""}${h.region?" · เขต "+esc(h.region):""} · ${esc(h.period)} (เดือนที่ ${h.mIdx} ของปีงบ)</span></div>
  <div class="kpis" style="margin-top:12px">
    <div class="kpi crit"><div class="lab">ผิดปกติ</div><div class="val">${s.c.crit}</div></div>
    <div class="kpi warn"><div class="lab">ควรตรวจสอบ</div><div class="val">${s.c.warn}</div></div>
    <div class="kpi ok"><div class="lab">ผ่าน</div><div class="val">${s.c.ok}</div></div>
    <div class="kpi"><div class="lab">ไม่พบบัญชี</div><div class="val">${s.c.na}</div></div>
  </div>
  <h2>ระยะเวลาเก็บหนี้</h2>
  <div class="dso">${dso}</div>
  <p class="note">ระยะเวลาเก็บหนี้ = ยอดลูกหนี้ยกไป ÷ (รายได้ค่ารักษาสะสมตั้งแต่ต้นปีงบ ÷ ${h.daysYTD} วัน) ใช้เฉพาะบัญชีรายได้ค่ารักษา ไม่รวมส่วนต่างค่ารักษา เส้นดำคือเกณฑ์ ${DSO_LIMIT} วัน ชี้ที่การ์ดเพื่อดูบัญชีรายได้ที่ใช้คำนวณ</p>
  <h2>ผลตรวจรายบัญชี</h2>
  <div class="filters">${fl}</div>
  ${groups||`<div class="empty">ไม่มีรายการในสถานะนี้</div>`}
  <details class="all"><summary>งบทดลองทั้งหมด (${h.rows.length} บัญชี)</summary>
    <div style="margin:10px 0"><input type="search" id="accSearch" placeholder="ค้นหารหัสหรือชื่อบัญชี"></div>
    <div class="scroll"><table><thead><tr><th>รหัสบัญชี</th><th>ชื่อบัญชี</th><th class="num">ยอดยกมา</th><th class="num">เดบิต</th><th class="num">เครดิต</th><th class="num">ยอดยกไป</th></tr></thead><tbody id="accBody"></tbody></table></div>
  </details>`;
  fillAcc(h,"");
  if(focusCat){const g=document.getElementById("g-"+focusCat);if(g)g.scrollIntoView({block:"start"});}
}
function fillAcc(h,q){
  q=q.trim().toLowerCase();
  document.getElementById("accBody").innerHTML=h.rows.filter(r=>!q||r[0].includes(q)||r[1].toLowerCase().includes(q))
    .map(r=>`<tr><td class="code">${r[0]}</td><td>${esc(r[1])}</td><td class="num">${fmt(r[2])}</td><td class="num">${fmt(r[3])}</td><td class="num">${fmt(r[4])}</td><td class="num">${fmt(r[5])}</td></tr>`).join("");
}

/* ---------- interaction ---------- */
function setTab(t,cat){
  ["exec","hosp"].forEach(x=>{document.getElementById("tab-"+x).setAttribute("aria-selected",x===t);document.getElementById("view-"+x).hidden=x!==t;});
  try{localStorage.setItem("tb-audit-tab",t)}catch(e){}
  if(t==="hosp")renderHosp(cat);else renderExec();
  if(!cat)window.scrollTo(0,0);
}
document.getElementById("tab-exec").onclick=()=>setTab("exec");
document.getElementById("tab-hosp").onclick=()=>setTab("hosp");
document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");
  if(go){curKey=go.dataset.go;filter="all";setTab("hosp",go.dataset.cat);return;}
  const rm=e.target.closest("[data-rm]");
  if(rm){hospitals=hospitals.filter(h=>h.key!==rm.dataset.rm);save();renderExec();toast("นำโรงพยาบาลออกแล้ว");return;}
  const f=e.target.closest("[data-f]");
  if(f){filter=f.dataset.f;renderHosp();}
});
document.addEventListener("change",e=>{if(e.target.id==="hospSel"){curKey=e.target.value;renderHosp();}});
document.addEventListener("input",e=>{if(e.target.id==="accSearch")fillAcc(hospitals.find(x=>x.key===curKey),e.target.value);});

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
async function handleFiles(files){
  if(typeof XLSX==="undefined"){toast("โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง");return;}
  let ok=0,bad=[];
  for(const f of files){
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
      const h=addRaw(parseSheet(aoa),false);curKey=h.key;ok++;}
    catch(err){bad.push(f.name);}
  }
  save();
  const cur=document.getElementById("tab-hosp").getAttribute("aria-selected")==="true"?"hosp":"exec";
  setTab(cur);
  toast(`เพิ่ม ${ok} ไฟล์`+(bad.length?` · อ่านไม่ได้: ${bad.join(", ")} (ต้องเป็นไฟล์งบทดลองที่มีคอลัมน์ รหัสบัญชี)`:""));
}
const fileIn=document.getElementById("fileIn");
document.getElementById("addBtn").onclick=()=>fileIn.click();
fileIn.onchange=()=>{handleFiles([...fileIn.files]);fileIn.value="";};
const drop=document.getElementById("drop");
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("on");}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==="drop"||!e.relatedTarget)drop.classList.remove("on");}));
document.addEventListener("drop",e=>{const fs=[...(e.dataTransfer?.files||[])].filter(f=>/\.xlsx?$/i.test(f.name));if(fs.length)handleFiles(fs);});

load();
let startTab="exec";try{startTab=localStorage.getItem("tb-audit-tab")||"exec"}catch(e){}
setTab(startTab==="hosp"?"hosp":"exec");
</script>

</body>
